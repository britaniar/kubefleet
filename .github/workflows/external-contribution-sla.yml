name: External Contribution SLA

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "0 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  intake:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Welcome external contributor
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const config = require("./.github/external-contributions.json");
            const automation = require("./.github/scripts/external-contributions.js");
            await automation.handleIntake({ github, context, config });

  record-response:
    if: >-
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve active SLA alert
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const config = require("./.github/external-contributions.json");
            const automation = require("./.github/scripts/external-contributions.js");
            await automation.handleResponse({ github, context, config });

  check-sla:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Alert on overdue external contributions
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const config = require("./.github/external-contributions.json");
            const automation = require("./.github/scripts/external-contributions.js");
            await automation.checkSla({
              github,
              context,
              config,
            });
