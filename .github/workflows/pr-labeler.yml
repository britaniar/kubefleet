name: PR Labeler

# Mirrors the conventional-commit prefix from a pull request title onto a label
# so that GitHub's generated release notes (see .github/release.yml) can group
# changes into categories. `pull_request_target` is used because the token for
# `pull_request` runs from forks is read-only. No contributor code is checked out
# or executed.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label for title prefix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const prefixLabels = {
              feat: { name: 'feat', color: '0e8a16' },
              fix: { name: 'fix', color: 'd73a4a' },
              docs: { name: 'docs', color: '0075ca' },
              test: { name: 'test', color: 'bfd4f2' },
              chore: { name: 'chore', color: 'ededed' },
              ci: { name: 'ci', color: 'ededed' },
              perf: { name: 'perf', color: 'c5def5' },
              refactor: { name: 'refactor', color: 'ededed' },
              revert: { name: 'revert', color: 'b60205' },
              style: { name: 'style', color: 'ededed' },
              interface: { name: 'interface', color: 'd4c5f9' },
              util: { name: 'util', color: 'ededed' },
            };

            const title = context.payload.pull_request.title || '';
            const match = title.match(/^([a-z]+)(\([^)]*\))?!?:/);
            const target = match ? prefixLabels[match[1]] : undefined;
            if (!target) {
              core.info(`No release-notes label maps to title "${title}".`);
              return;
            }

            const managed = new Set(Object.values(prefixLabels).map((label) => label.name));
            const current = context.payload.pull_request.labels.map((label) => label.name);

            for (const label of current) {
              if (managed.has(label) && label !== target.name) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.payload.pull_request.number,
                  name: label,
                });
              }
            }

            if (current.includes(target.name)) {
              return;
            }

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: target.name });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel({
                ...context.repo,
                name: target.name,
                color: target.color,
                description: 'Release notes category, applied from the PR title prefix.',
              });
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [target.name],
            });
